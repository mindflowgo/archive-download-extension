name: Build and Package Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test, Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit & integration tests
        run: bun test

      - name: Build extension
        run: bun extension/build.ts

      - name: Verify build artifacts
        run: |
          test -f extension/dist/manifest.json || { echo "manifest.json missing from dist"; exit 1; }
          test -f extension/dist/content.js || { echo "content.js missing from dist"; exit 1; }
          test -f extension/dist/background.js || { echo "background.js missing from dist"; exit 1; }
          echo "All critical extension files verified in extension/dist/"

      - name: Package extension ZIP
        run: |
          cd extension/dist
          zip -r ../../archive-downloader.zip ./*
          cd ../..
          echo "Package created: archive-downloader.zip ($(du -h archive-downloader.zip | cut -f1))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-downloader
          path: archive-downloader.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: archive-downloader.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
